name: Avisos AEMET

on:
  schedule:
    - cron: '*/30 * * * *'   # cada media hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar avisos de AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/avisos_aemet.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add avisos.json
          git diff --cached --quiet || (git commit -m "Actualizar avisos AEMET" && git pull --rebase && git push)
