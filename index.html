<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mi Tiempo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#0284c7;--color-primary-light:#e0f2fe;--color-primary-dark:#0369a1;
  --color-surface:rgba(255,255,255,.78);--color-border:rgba(255,255,255,.7);
  --color-text:#0f172a;--color-text-muted:#475569;
  --ok:#16a34a;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#dc2626;--bad-bg:#fee2e2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--color-text);min-height:100%;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:linear-gradient(-45deg,#e0f2fe,#fef9c3,#dcfce7,#fce7f3,#ede9fe);background-size:400% 400%;
  animation:bg 22s ease infinite;background-attachment:fixed}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
h1{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
h1 span{color:var(--color-primary)}
.btn{border:0;background:#fff;color:var(--color-primary-dark);font:inherit;font-weight:800;border-radius:14px;
  min-height:44px;padding:0 14px;box-shadow:0 4px 0 #bae6fd;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #bae6fd}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
.btn:disabled{opacity:.6}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{border:2px solid transparent;background:var(--color-surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:16px;min-height:52px;font:inherit;font-weight:800;font-size:.95rem;color:var(--color-text-muted);cursor:pointer;padding:6px}
.tab[aria-selected="true"]{background:#fff;color:var(--color-primary-dark);border-color:var(--color-primary);box-shadow:0 6px 18px rgba(2,132,199,.18)}
.tab small{display:block;font-weight:700;font-size:.78rem;opacity:.8}
.card{background:var(--color-surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--color-border);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(15,23,42,.07);
  animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{font-size:1rem;font-weight:800;color:var(--color-text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.now{display:flex;align-items:center;gap:16px}
.now .ico{font-size:4.2rem;line-height:1}
.now .t{font-size:3.6rem;font-weight:900;line-height:1}
.now .d{font-weight:800;font-size:1.1rem}
.now .s{color:var(--color-text-muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#fff;border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.05rem}
.stat span{font-size:.78rem;color:var(--color-text-muted);font-weight:700}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.h{flex:0 0 68px;background:#fff;border-radius:16px;padding:10px 4px;text-align:center;scroll-snap-align:start}
.h .hh{font-size:.82rem;font-weight:800;color:var(--color-text-muted)}
.h .hi{font-size:1.6rem;margin:4px 0}
.h .ht{font-weight:900}
.h .hp{font-size:.75rem;color:var(--color-primary-dark);font-weight:700}
.h .hw{font-size:.75rem;font-weight:800;margin-top:3px;border-radius:8px;padding:1px 0}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:1.2fr auto 1fr 1fr;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px}
.day .dn{font-weight:800}
.day .di{font-size:1.8rem}
.day .dt{font-weight:900;text-align:right}
.day .dt em{font-style:normal;color:var(--color-text-muted);font-weight:700}
.day .dx{font-size:.82rem;color:var(--color-text-muted);font-weight:700;text-align:right}
.sea{border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;border:2px solid}
.sea.ok{background:var(--ok-bg);border-color:#86efac;color:#14532d}
.sea.warn{background:var(--warn-bg);border-color:#fcd34d;color:#78350f}
.sea.bad{background:var(--bad-bg);border-color:#fca5a5;color:#7f1d1d}
.light{display:flex;flex-direction:column;gap:5px;background:#334155;padding:7px;border-radius:14px}
.light i{width:22px;height:22px;border-radius:50%;background:#64748b;display:block}
.sea.ok .light i:nth-child(3){background:#22c55e;box-shadow:0 0 12px #22c55e}
.sea.warn .light i:nth-child(2){background:#f59e0b;box-shadow:0 0 12px #f59e0b}
.sea.bad .light i:nth-child(1){background:#ef4444;box-shadow:0 0 12px #ef4444}
.sea .big{font-size:1.4rem;font-weight:900}
.sea p{font-weight:700}
.w-ok{background:var(--ok-bg);color:var(--ok)}.w-warn{background:var(--warn-bg);color:var(--warn)}.w-bad{background:var(--bad-bg);color:var(--bad)}
.advice{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(15,23,42,.08);border:2px solid #bae6fd;animation:up .3s ease}
.advice .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.advice h2{font-size:1.15rem;font-weight:900}
.advice .sub{color:var(--color-text-muted);font-weight:700;font-size:.85rem}
.gear{border:0;background:var(--color-primary-light);border-radius:12px;min-width:44px;min-height:44px;font-size:1.2rem;cursor:pointer}
.wear{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.item{border-radius:16px;padding:12px 6px;text-align:center;background:var(--color-primary-light)}
.item .e{font-size:2.2rem;line-height:1.1}
.item b{display:block;font-size:.95rem;margin-top:4px}
.item.off{background:#f1f5f9;opacity:.55}
.item.off b{text-decoration:line-through}
.alerts{display:grid;gap:6px}
.al{border-radius:12px;padding:9px 12px;font-weight:800;font-size:.92rem}
.al.cold{background:#dbeafe;color:#1e3a8a}.al.hot{background:#ffedd5;color:#9a3412}
.al.info{background:#f1f5f9;color:#334155}.al.rain{background:#e0f2fe;color:#075985}
.range{display:flex;justify-content:space-around;font-weight:800;color:var(--color-text-muted);font-size:.88rem;margin-bottom:10px}
.range b{color:var(--color-text);font-size:1.05rem}
.bigh{font-size:1.9rem;font-weight:900;line-height:1;text-align:center;min-width:84px}
.bigh small{display:block;font-size:.85rem;font-weight:800;margin-top:4px}
.bbars{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:14px}
.bb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.bb .bf{border-radius:6px 6px 2px 2px;min-height:6px}
.bb span{font-size:.72rem;font-weight:800;color:var(--color-text-muted);margin-top:3px}
.bb.best span{color:var(--color-text);font-weight:900}
.bb.best .bf{outline:2px solid #0f172a;outline-offset:1px}
.fauna{display:grid;gap:8px}
.fa{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px}
.fa.dim{opacity:.55}
.fa svg{flex:0 0 64px;background:#f0f9ff;border-radius:14px}
.fb{flex:1;min-width:0}
.fn{font-weight:900;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lv{font-size:.72rem;font-weight:900;border-radius:999px;padding:2px 8px}
.fd{font-size:.82rem;font-weight:600;color:var(--color-text-muted);margin:2px 0 6px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.strip i{font-style:normal;font-size:.62rem;font-weight:900;text-align:center;border-radius:4px;color:#334155;padding:1px 0}
.strip i.cur{outline:2px solid #0f172a;outline-offset:0}
.fx{font-size:.8rem;font-weight:800;color:#b45309;margin-top:6px}
.dlg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.dlg.open{display:flex}
.dlg-box{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:up .25s ease;margin-bottom:env(safe-area-inset-bottom,0)}
.dlg-box .top{display:flex;justify-content:space-between;align-items:center}
.dlg-box h2{font-size:1.3rem;font-weight:900}
.dlg-box h3{font-size:.85rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--color-primary-dark);margin:16px 0 8px}
.plist{display:grid;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;border-radius:12px;padding:6px 6px 6px 12px}
.prow small,.qrow small{color:var(--color-text-muted);font-weight:700}
.mini-b{border:0;background:#fff;border-radius:10px;min-width:40px;min-height:40px;font-weight:900;cursor:pointer;margin-left:4px}
.mini-b:disabled{opacity:.3}
.mini-b.del{color:#b91c1c}
.lab{font-weight:800;font-size:.85rem;display:grid;gap:4px}
.srch{display:flex;gap:8px;margin-top:6px}
.srch input,.lab input,.lab select{font:inherit;font-weight:700;border:2px solid #cbd5e1;border-radius:10px;padding:8px;min-height:44px;width:100%;background:#fff}
.qr{display:grid;gap:6px;margin-top:8px}
.qrow{text-align:left;border:2px solid #e0f2fe;background:#f0f9ff;border-radius:12px;padding:10px;font:inherit;cursor:pointer;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok-b{width:100%;margin-top:16px;background:var(--color-primary);color:#fff;box-shadow:0 4px 0 var(--color-primary-dark)}
.more{margin-top:10px}
.more summary{cursor:pointer;font-weight:800;color:var(--color-text-muted);padding:8px 4px;min-height:44px}
.avi{grid-column:1/-1;border-radius:20px;padding:16px;border:3px solid;animation:avi 1.6s ease-in-out infinite}
.avi.l1{background:#fef9c3;border-color:#eab308;color:#713f12;--g:rgba(234,179,8,.45)}
.avi.l2{background:#ffedd5;border-color:#f97316;color:#7c2d12;--g:rgba(249,115,22,.5)}
.avi.l3{background:#fee2e2;border-color:#dc2626;color:#7f1d1d;--g:rgba(220,38,38,.55)}
@keyframes avi{0%,100%{box-shadow:0 0 0 0 var(--g)}50%{box-shadow:0 0 0 8px transparent}}
.avi-h{display:flex;gap:12px;align-items:center}
.avi-i{font-size:2.4rem;line-height:1}
.avi-t{font-size:1.35rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.avi-s{font-weight:800;font-size:.9rem}
.avi ul{list-style:none;margin:10px 0 0;display:grid;gap:6px}
.avi li{background:rgba(255,255,255,.7);border-radius:12px;padding:8px 10px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvdot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.lvdot.l1{background:#eab308}.lvdot.l2{background:#f97316}.lvdot.l3{background:#dc2626}
.ofi{background:#0f172a;color:#fff;border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:900;margin-right:4px}
.avi details{width:100%;font-size:.82rem;font-weight:600}
.avi summary{cursor:pointer;font-weight:800;opacity:.85}
.cancel{grid-column:1/-1}
.cancel.rainy{border-color:#38bdf8;background:#f0f9ff;animation:avi 1.6s ease-in-out infinite;--g:rgba(56,189,248,.5)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cg{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px;border:2px solid #e2e8f0}
.cg.wet{border-color:#38bdf8}
.cg svg{flex:0 0 56px;width:56px;height:56px}
.cgl{font-weight:800;font-size:.8rem;color:var(--color-text-muted)}
.cgt{font-weight:900;font-size:1.4rem;line-height:1.1}
.cgs{font-weight:800;font-size:.8rem}
.cg.wet .cgs{color:#0369a1}
@media (max-width:420px){.cg{flex-direction:column;text-align:center}}
.avi-n{font-size:.75rem;font-weight:700;margin-top:8px;opacity:.8}
.blk{border-radius:18px;padding:12px;margin-top:14px}
.blk-t{font-weight:900;font-size:.82rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.blk-t::after{content:'';flex:1;height:2px;border-radius:2px;background:currentColor;opacity:.2}
.day-blk{background:#f0f9ff;border:2px solid #bae6fd}
.day-blk .blk-t{color:#0369a1}
.day-blk .wear{margin:0 0 4px}
.day-blk .item{background:#fff}
.day-blk .chips{margin:8px 0 0}
.mom-blk{background:#fff;border:2px dashed #e2e8f0;margin-bottom:12px}
.mom-blk .blk-t{color:#475569}
.mom-blk .moments{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:#f1f5f9;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.88rem}
.moments{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mom{background:#f8fafc;border-radius:14px;padding:10px 6px;text-align:center}
.mom .mn{font-size:.75rem;font-weight:800;color:var(--color-text-muted)}
.mom .mi{position:relative;display:inline-block;margin:4px 0}
.mom .mu{position:absolute;right:-18px;top:-6px}
.mom .mp{color:#0369a1}
.item .e svg{display:block;margin:0 auto}
.item.off svg{filter:grayscale(1)}
.mom .mf{font-size:1.5rem;font-weight:900}
.mom .mw{font-size:.8rem;font-weight:800}
.settings{display:none;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px;background:#f8fafc;border-radius:14px;padding:12px}
.settings.open{display:grid}
.settings label{font-weight:800;font-size:.85rem;display:grid;gap:4px}
.settings input{font:inherit;font-weight:800;border:2px solid #cbd5e1;border-radius:10px;padding:8px;min-height:44px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.mini{background:var(--color-surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:14px;border:2px solid transparent;animation:up .3s ease}
.mini .mt{font-weight:900;font-size:.85rem;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.4px}
.mini .mv{font-weight:900;font-size:1.1rem;margin:6px 0 2px;display:flex;gap:6px;align-items:center}
.mini .ms{font-weight:700;font-size:.85rem;color:var(--color-text-muted)}
.mini.ok{border-color:#86efac}.mini.ok .mv{color:#15803d}
.mini.warn{border-color:#fcd34d}.mini.warn .mv{color:#b45309}
.mini.bad{border-color:#fca5a5}.mini.bad .mv{color:#b91c1c}
.uv{display:inline-block;border-radius:8px;padding:1px 7px;font-weight:900;font-size:.8rem;margin-top:6px}
#map{height:min(62vh,480px);border-radius:16px;z-index:0}
.rbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.rbar input{flex:1;accent-color:var(--color-primary)}
.rbar span{font-weight:900;min-width:92px;text-align:right}
.tabs{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.tabs .tab{flex:0 0 auto;min-width:104px;scroll-snap-align:start}
.tab-add{color:var(--color-primary-dark)!important;border:2px dashed #7dd3fc!important}
.foot{text-align:center;font-size:.8rem;color:var(--color-text-muted);font-weight:600;margin-top:10px}
.foot a{color:inherit}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.9),rgba(255,255,255,.5));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
.err{background:var(--bad-bg);color:#7f1d1d;border-radius:18px;padding:16px;font-weight:700}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.now .t{font-size:3rem}.tab{font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mi <span>Tiempo</span></h1>
    <button class="btn" id="refresh" aria-label="Actualizar datos">↻ Actualizar</button>
  </header>
  <section class="advice" id="advice" aria-live="polite"><div class="sk" style="height:180px;margin:0"></div></section>
  <section class="minis" id="minis"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main" aria-live="polite"></main>
  <p class="foot" id="foot"></p>
</div>

<script>
const DEFAULT_PLACES = [
  {id:'santafe',  name:'Santa Fe',  sub:'Granada', lat:37.1887, lon:-3.7178},
  {id:'maracena', name:'Maracena',  sub:'Granada', lat:37.2068, lon:-3.6349},
  {id:'castell',  name:'Castell de Ferro', sub:'Granada', lat:36.7239, lon:-3.3567, sea:{lat:36.70, lon:-3.357}}
];
function loadPlaces(){ try{ const a=JSON.parse(localStorage.getItem('mt-places')); if(Array.isArray(a)&&a.length) return a; }catch(e){} return DEFAULT_PLACES.slice(); }
function savePlaces(){ try{ localStorage.setItem('mt-places', JSON.stringify(PLACES)); }catch(e){} }
let PLACES = loadPlaces();
const byId = id => PLACES.find(p=>p.id===id);
const TZ = 'Europe/Madrid';
const VERSION = 'v16';
const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const cache = {};
let current = localStorage.getItem('mt-place') || PLACES[0].id;
if (current!=='radar' && !byId(current)) current = PLACES[0].id;

function wmo(c, night){
  const m = {0:['Despejado',night?'🌙':'☀️'],1:['Casi despejado',night?'🌙':'🌤️'],2:['Intervalos nubosos',night?'☁️':'⛅'],3:['Nublado','☁️'],
    45:['Niebla','🌫️'],48:['Niebla','🌫️'],51:['Llovizna débil','🌦️'],53:['Llovizna','🌦️'],55:['Llovizna intensa','🌧️'],
    56:['Llovizna helada','🌧️'],57:['Llovizna helada','🌧️'],61:['Lluvia débil','🌦️'],63:['Lluvia','🌧️'],65:['Lluvia fuerte','🌧️'],
    66:['Lluvia helada','🌧️'],67:['Lluvia helada','🌧️'],71:['Nieve débil','🌨️'],73:['Nieve','🌨️'],75:['Nieve fuerte','❄️'],77:['Granizo fino','🌨️'],
    80:['Chubascos','🌦️'],81:['Chubascos','🌧️'],82:['Chubascos fuertes','⛈️'],85:['Chubascos de nieve','🌨️'],86:['Chubascos de nieve','❄️'],
    95:['Tormenta','⛈️'],96:['Tormenta con granizo','⛈️'],99:['Tormenta con granizo','⛈️']};
  return m[c] || ['—','🌡️'];
}
function windDir(d){return ['N','NE','E','SE','S','SO','O','NO'][Math.round(d/45)%8]}
// Olas (Mediterráneo, costa granadina): umbrales en metros
function seaLevel(wave, wind){
  let lvl = wave < 0.5 ? 0 : wave < 1.25 ? 1 : 2;
  if (wind >= 40) lvl = Math.max(lvl, 2); else if (wind >= 25) lvl = Math.max(lvl, 1);
  return [
    {cls:'ok',  txt:'Pocas olas',    msg:'Mar en calma. Buen día de playa.'},
    {cls:'warn',txt:'Olas moderadas',msg:'Algo de oleaje. Precaución con niños y al nadar.'},
    {cls:'bad', txt:'Muchas olas',   msg:'Mar agitado. Mejor no bañarse.'}
  ][lvl];
}
const waveCls = w => w < 0.5 ? 'w-ok' : w < 1.25 ? 'w-warn' : 'w-bad';

async function load(p, force){
  if (cache[p.id] && !force && Date.now() - cache[p.id].t < 10*60*1000) return cache[p.id];
  const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`+
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day,precipitation`+
    `&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,precipitation,is_day,wind_speed_10m,relative_humidity_2m,uv_index,wind_gusts_10m,snowfall`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max`+
    `&timezone=${encodeURIComponent(TZ)}&forecast_days=4&past_days=1`;
  const nc = `&_=${Date.now()}`, opt = {cache:'no-store'};
  const reqs = [fetch(fUrl+nc, opt).then(r=>{if(!r.ok)throw 0;return r.json()})];
  if (p.sea){
    const mUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${p.sea.lat}&longitude=${p.sea.lon}`+
      `&current=wave_height,wave_period,wave_direction,sea_surface_temperature`+
      `&hourly=wave_height&daily=wave_height_max&timezone=${encodeURIComponent(TZ)}&forecast_days=3`;
    reqs.push(fetch(mUrl+nc, opt).then(r=>{if(!r.ok)throw 0;return r.json()}));
  }
  const [w, m] = await Promise.all(reqs);
  cache[p.id] = {w, m, t:Date.now()};
  return cache[p.id];
}

function renderTabs(){
  const t = document.getElementById('tabs');
  const TABS = [...PLACES, {id:'radar', name:'Radar', sub:'Lluvia'}];
  t.innerHTML = TABS.map(p=>`<button class="tab" role="tab" aria-selected="${p.id===current}" data-id="${p.id}">${p.sea?'🌊 ':''}${p.name}<small>${p.sub||''}</small></button>`).join('')
    + `<button class="tab tab-add" id="addTab" aria-label="Gestionar localidades">＋<small>Lugares</small></button>`;
  document.getElementById('addTab').onclick = openSettings;
  t.querySelectorAll('.tab[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;try{localStorage.setItem('mt-place',current)}catch(e){};renderTabs();show()});
}

let lastT = 0;
function paintFoot(){
  if (!lastT) return;
  const min = Math.floor((Date.now()-lastT)/60000);
  const rel = min < 1 ? 'ahora mismo' : min === 1 ? 'hace 1 minuto' : `hace ${min} minutos`;
  document.getElementById('foot').innerHTML =
    `Actualizado ${rel} (${new Date(lastT).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}) · Datos: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · ${VERSION}`;
}
setInterval(paintFoot, 30000);

async function show(force){
  stopRadar();
  if (current === 'radar') return showRadar();
  const p = PLACES.find(x=>x.id===current);
  const main = document.getElementById('main');
  const btn = document.getElementById('refresh');
  if (!cache[p.id] || force) main.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  btn.disabled = true;
  try{
    const {w, m, t} = await load(p, force);
    if (p.id !== current) return;
    main.innerHTML = html(p, w, m);
    lastT = t; paintFoot();
  }catch(e){
    main.innerHTML = '<div class="err">⚠️ No se han podido cargar los datos. Comprueba la conexión y pulsa «Actualizar».</div>';
  }finally{ btn.disabled = false; }
}

function html(p, w, m){
  const c = w.current, [desc, ico] = wmo(c.weather_code, !c.is_day);
  let out = '';

  // Mar (solo Castell de Ferro)
  if (m && m.current){
    const wh = m.current.wave_height ?? 0, lv = seaLevel(wh, c.wind_speed_10m);
    out += `<section class="card"><h2>Estado del mar</h2>
      <div class="sea ${lv.cls}" role="status">
        <div class="light" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><div class="big">${lv.txt}</div><p>${lv.msg}</p></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${wh.toFixed(1)} m</b><span>Altura ola</span></div>
        <div class="stat"><b>${m.current.wave_period!=null?Math.round(m.current.wave_period)+' s':'—'}</b><span>Periodo</span></div>
        <div class="stat"><b>${Math.round(c.wind_speed_10m)} km/h</b><span>Viento ${windDir(c.wind_direction_10m)}</span></div>
        <div class="stat"><b>${m.current.sea_surface_temperature!=null?Math.round(m.current.sea_surface_temperature)+'°':'—'}</b><span>Agua</span></div>
      </div></section>`;
    out += beachHtml(w, m);
    if (p.lat>35.8 && p.lat<37.2 && p.lon>-5.5 && p.lon<-1.6) out += faunaHtml(w, m);
  }

  // Ahora
  out += `<section class="card"><h2>Ahora en ${p.name}</h2>
    <div class="now"><div class="ico" aria-hidden="true">${ico}</div>
      <div><div class="t">${Math.round(c.temperature_2m)}°</div><div class="d">${desc}</div>
      <div class="s">Sensación ${Math.round(c.apparent_temperature)}°</div></div></div>
    ${m ? '' : `<div class="stats">
      <div class="stat"><b>${Math.round(c.wind_speed_10m)} km/h</b><span>Viento ${windDir(c.wind_direction_10m)}</span></div>
      <div class="stat"><b>${c.relative_humidity_2m}%</b><span>Humedad</span></div>
      <div class="stat"><b>${c.precipitation} mm</b><span>Lluvia</span></div>
      <div class="stat"><b>${Math.round(w.daily.temperature_2m_max[1])}° / ${Math.round(w.daily.temperature_2m_min[1])}°</b><span>Máx / mín</span></div>
    </div>`}</section>`;

  // Próximas horas (24 h)
  const now = new Date(c.time); now.setMinutes(0);
  const h = w.hourly; let start = h.time.findIndex(x => new Date(x) >= now); if (start < 0) start = 0;
  const waveAt = t => { if(!m||!m.hourly) return null; const i = m.hourly.time.indexOf(t); return i>=0 ? m.hourly.wave_height[i] : null; };
  let hrs = '';
  for (let i = start; i < Math.min(start+24, h.time.length); i++){
    const [, hi] = wmo(h.weather_code[i], !h.is_day[i]);
    const wv = waveAt(h.time[i]);
    hrs += `<div class="h"><div class="hh">${i===start?'Ahora':h.time[i].slice(11,16)}</div><div class="hi" aria-hidden="true">${hi}</div>
      <div class="ht">${Math.round(h.temperature_2m[i])}°</div><div class="hp">💧${h.precipitation_probability[i] ?? 0}%</div>
      ${wv!=null?`<div class="hw ${waveCls(wv)}">🌊${wv.toFixed(1)}</div>`:''}</div>`;
  }
  out += `<section class="card"><h2>Próximas horas</h2><div class="hours">${hrs}</div></section>`;

  // Hoy + 2 días
  const d = w.daily; let days = '';
  const d0 = Math.max(0, d.time.indexOf(c.time.slice(0,10)));
  for (let k = 0; k < 3; k++){ const i = d0 + k;
    const [dd, di] = wmo(d.weather_code[i]);
    const name = k===0 ? 'Hoy' : k===1 ? 'Mañana' : DAYS[new Date(d.time[i]+'T12:00').getDay()];
    const wm = m && m.daily ? m.daily.wave_height_max[k] : null;
    days += `<div class="day"><div><div class="dn">${name}</div><div class="dx" style="text-align:left">${dd}</div></div>
      <div class="di" aria-hidden="true">${di}</div>
      <div class="dx">💧${d.precipitation_probability_max[i] ?? 0}%${wm!=null?`<br><span class="hw ${waveCls(wm)}" style="padding:1px 6px;border-radius:8px">🌊 ${wm.toFixed(1)} m</span>`:`<br>💨 ${Math.round(d.wind_speed_10m_max[i])} km/h`}</div>
      <div class="dt">${Math.round(d.temperature_2m_max[i])}° <em>${Math.round(d.temperature_2m_min[i])}°</em></div></div>`;
  }
  out += `<section class="card"><h2>Hoy y próximos días</h2><div class="days">${days}</div></section>`;
  return out;
}

  const casa = byId(c.casa) ? c.casa : (byId('maracena') ? 'maracena' : PLACES[0].id);
  const trabajo = byId(c.trabajo) ? c.trabajo : (byId('santafe') ? 'santafe' : PLACES[0].id);
  return {salida:c.salida||'08:00', vuelta:c.vuelta||'15:00', recreo:c.recreo||'12:00', entrada:c.entrada||'09:00', salCole:c.salCole||'13:50', casa, trabajo}; }
function setCfg(c){ try{localStorage.setItem('mt-cfg',JSON.stringify(c))}catch(e){} }
const pad = n => String(n).padStart(2,'0');
function addDays(ds, n){ const d=new Date(ds+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

// Qué llevar puesto según la sensación térmica (persona normal)
function wearAt(f){
  if (f < 3)  return {k:'abrigo', t:'Abrigo gordo'};
  if (f < 7)  return {k:'chaqueton', t:'Chaquetón'};
  if (f < 12) return {k:'chaqueta', t:'Chaqueta'};
  if (f < 15) return {k:'abrigada', t:'Manga larga abrigada'};
  if (f < 20) return {k:'fina', t:'Manga larga fina'};
  if (f < 27) return {k:'corta', t:'Manga corta'};
  return {k:'fresca', t:'Ropa fresca'};
}

// Franjas del día con lluvia prevista (localidad de trabajo)
function rainRanges(w, date, thr){
  const H=w.hourly, hrs=[];
  for(let h=0;h<24;h++){ const i=H.time.indexOf(`${date}T${pad(h)}:00`); if(i<0) continue;
    const pr=H.precipitation_probability[i]??0, mm=H.precipitation[i]??0;
    if(pr>=thr || mm>=0.2) hrs.push({h,pr,mm}); }
  const g=[]; hrs.forEach(x=>{ const last=g[g.length-1]; if(last && x.h===last.to+1){ last.to=x.h; last.pr=Math.max(last.pr,x.pr); last.mm+=x.mm; } else g.push({from:x.h,to:x.h,pr:x.pr,mm:x.mm}); });
  return g;
}
function rangesText(g){
  const t=g.map(r=>`${r.from===r.to?`a las ${pad(r.from)}:00`:`de ${pad(r.from)}:00 a ${pad(r.to+1)}:00`} (${r.pr}%${r.mm>=1?`, ${Math.round(r.mm)} mm`:''})`);
  return t.length>1 ? t.slice(0,-1).join(', ')+' y '+t[t.length-1] : t[0];
}

// Recoge las horas del trayecto: salida en Maracena (1 h) y jornada en Santa Fe
function windowData(mar, sf, date, cfg){
  const hS = parseInt(cfg.salida), hV = Math.max(parseInt(cfg.vuelta), hS+1);
  const rows = [];
  const take = (w, h) => { const i = w.hourly.time.indexOf(`${date}T${pad(h)}:00`); if (i<0) return null;
    const H=w.hourly, r={h, feel:H.apparent_temperature[i], temp:H.temperature_2m[i], prob:H.precipitation_probability[i]??0,
      rain:H.precipitation[i]??0, wind:H.wind_speed_10m[i]??0, uv:H.uv_index[i]??0, code:H.weather_code[i]}; rows.push(r); return r; };
  const sal = take(mar, hS);
  let rec = null, vue = null;
  for (let h = hS+1; h <= hV; h++){ const r = take(sf, h); if (h===parseInt(cfg.recreo)) rec = r; if (h===hV) vue = r; }
  if (!rows.length) return null;
  const mx = k => Math.max(...rows.map(r=>r[k])), mn = k => Math.min(...rows.map(r=>r[k]));
  const rainG = rainRanges(sf, date, 40), drizzleG = rainRanges(sf, date, 30);
  return {sal, rec, vue, hS, hV, rainG, drizzleG, minFeel:mn('feel'), maxFeel:mx('feel'), minT:mn('temp'), maxT:mx('temp'), prob:mx('prob'), uv:mx('uv'),
    rain:rows.reduce((a,r)=>a+r.rain,0), wind:mx('wind'), storm:rows.some(r=>r.code>=95), snow:rows.some(r=>r.code>=71&&r.code<=77||r.code===85||r.code===86)};
}

function recommend(x, y){
  const top = x.maxFeel >= 27 ? {k:'fresca', t:'Ropa fresca'} : x.maxFeel >= 21 ? {k:'corta', t:'Manga corta'} : x.maxFeel >= 15 ? {k:'fina', t:'Manga larga fina'} : {k:'abrigada', t:'Manga larga abrigada'};
  let outer;
  if (x.minFeel < 3)       outer = {k:'abrigo', t:'Abrigo gordo'};
  else if (x.minFeel < 7)  outer = {k:'chaqueton', t:'Chaquetón'};
  else if (x.minFeel < 12) outer = {k:'chaqueta', t:'Chaqueta'};
  else if (x.minFeel < 16) outer = {k:'sudadera', t:'Sudadera'};
  else                     outer = {k:'chaqueta', t:'Sin chaqueta', off:true};
  const midFeel = x.rec ? x.rec.feel : x.maxFeel;
  const capas = !outer.off && midFeel - x.minFeel >= 7 && midFeel >= 17;
  if (capas) outer.t += ' (solo al salir)';
  const wet = x.prob >= 50 || x.rain >= 0.5, maybe = !wet && x.prob >= 30;
  const umb = wet ? {k:'paraguas', t:'Paraguas'} : maybe ? {k:'paraguas', t:'Paraguas pequeño'} : {k:'paraguas', t:'Sin paraguas', off:true};

  // Complementos
  const acc = [];
  if (x.minFeel < 5 || (x.minFeel < 9 && x.wind >= 25)) acc.push('🧣 Bufanda');
  if (x.minFeel < 3) acc.push('🧤 Guantes');
  if (x.minFeel < 0) acc.push('🧢 Gorro de lana');
  if (x.minFeel < 3) acc.push('🧦 Camiseta térmica');
  if (x.uv >= 6 || x.maxFeel >= 28) acc.push('🕶️ Gafas de sol');
  if (x.uv >= 7 || x.maxFeel >= 30) acc.push('🧢 Gorra');
  if (x.uv >= 6) acc.push('🧴 Crema solar');
  if (x.maxT >= 30) acc.push('💧 Agua');

  const al = [];
  if (x.minT < 1) al.push(['cold','🥶 Día muy frío: helada al salir. Rasca el parabrisas con tiempo.']);
  else if (x.minFeel < 3) al.push(['cold','🥶 Día bastante frío: abrígate bien.']);
  else if (x.minFeel < 7) al.push(['cold','❄️ Mañana fría al salir de casa.']);
  if (x.maxT >= 36) al.push(['hot','🥵 Día de mucho calor: ropa muy fresca, agua y evita el sol al mediodía.']);
  else if (x.maxT >= 32) al.push(['hot','☀️ Día bastante caluroso: ropa fresca y agua.']);
  if (capas) al.push(['info',`🔄 Día de capas: sales a ${Math.round(x.minFeel)}° y en el recreo habrá ${Math.round(midFeel)}°. Debajo, ${top.t.toLowerCase()}; la prenda de abrigo te la quitarás a media mañana.`]);
  if (y && x.minFeel <= y.minFeel - 4) al.push(['cold',`📉 Bastante más frío que ayer (${Math.round(y.minFeel - x.minFeel)}° menos al salir).`]);
  if (y && x.maxFeel >= y.maxFeel + 4) al.push(['hot',`📈 Bastante más calor que ayer (${Math.round(x.maxFeel - y.maxFeel)}° más).`]);
  if (x.storm) al.push(['rain','⛈️ Posibles tormentas.']);
  if (x.snow) al.push(['cold','❄️ Posible nieve o aguanieve.']);
  if (x.wind >= 30) al.push(['info',`💨 Viento fuerte (hasta ${Math.round(x.wind)} km/h).`]);
  if (wet) al.push(['rain', x.rainG.length ? `🌧️ Lluvia probable ${rangesText(x.rainG)}.` : `🌧️ Lluvia probable (${x.prob}%).`]);
  else if (maybe && x.drizzleG.length) al.push(['rain',`🌦️ Puede chispear ${rangesText(x.drizzleG)}.`]);

  // Cómo irás en cada momento
  const moments = [['Al salir', x.sal], ['Recreo', x.rec], ['Vuelta', x.vue]].filter(m=>m[1])
    .map(([n,r])=>({n:`${n} · ${pad(r.h)}:00`, f:Math.round(r.feel), w:wearAt(r.feel), wet:r.prob>=40||r.rain>=0.2, p:r.prob}));
  return {items:[top, outer, umb], acc, al, moments};
}

async function showAdvice(force){
  const box = document.getElementById('advice'), cfg = getCfg();
  try{
    const casa=byId(cfg.casa), trab=byId(cfg.trabajo);
    const [mar, sf] = await Promise.all([load(casa, force), load(trab, force)]);
    const nowS = sf.w.current.time, today = nowS.slice(0,10);
    const after = parseInt(nowS.slice(11,13)) >= parseInt(cfg.vuelta);
    const date = after ? addDays(today, 1) : today;
    const x = windowData(mar.w, sf.w, date, cfg), y = windowData(mar.w, sf.w, addDays(date,-1), cfg);
    if (!x) throw 0;
    const r = recommend(x, y);
    const cn = cancelas(sf.w, date, cfg);
    if (cn && (cn.ent.wet||cn.sal.wet)) r.al.unshift(['rain', `🚪 Cancelas: ${[cn.ent.wet?`ábrelas a las ${cn.ent.t} para la entrada`:'',cn.sal.wet?`ábrelas a las ${cn.sal.t} para la salida`:''].filter(Boolean).join(' y ')}, que llueve.`]);
    box.innerHTML = `<div class="top"><div><h2>${after ? 'Para mañana' : 'Hoy'} me pongo…</h2>
        <div class="sub">${casa.name} ${cfg.salida} → ${trab.name} hasta las ${cfg.vuelta}</div></div>
        <button class="gear" id="gear" aria-label="Ajustes">⚙️</button></div>
      <div class="blk day-blk"><div class="blk-t">Mi recomendación para el día</div>
      <div class="wear">${r.items.map(i=>`<div class="item ${i.off?'off':''}"><div class="e">${svg(i.k)}</div><b>${i.t}</b></div>`).join('')}</div>
      ${r.acc.length ? `<div class="chips">${r.acc.map(a=>`<span class="chip">${a}</span>`).join('')}</div>` : ''}</div>

// ===== Mejor hora para bajar a la playa (Castell de Ferro) =====
function beachScore(H, i, wave){
  const feel=H.apparent_temperature[i], wind=H.wind_speed_10m[i]??0, prob=H.precipitation_probability[i]??0, uv=H.uv_index[i]??0;
  let p = 0;
  p += Math.max(0, wave-0.2)*45;                 // olas
  p += Math.abs(feel-26)*3 + Math.max(0, feel-30)*3; // temperatura (ideal ~26°)
  p += Math.max(0, wind-10)*1.3;                 // viento
  p += prob*0.5;                                 // lluvia
  p += Math.max(0, uv-7)*4;                      // sol muy fuerte
  return {s:Math.max(0, Math.min(100, Math.round(100-p))), feel, wind, wave, uv, prob};
}
function beachDay(w, m, date, fromH){
  const H=w.hourly, out=[];
  for (let h=Math.max(9,fromH); h<=20; h++){
    const t=`${date}T${pad(h)}:00`, i=H.time.indexOf(t), j=m.hourly.time.indexOf(t);
    if (i<0 || j<0 || !H.is_day[i]) continue;
    out.push({h, ...beachScore(H, i, m.hourly.wave_height[j] ?? 0)});
  }
  return out;
}
function beachHtml(w, m){
  const now=w.current.time, today=now.slice(0,10), hr=parseInt(now.slice(11,13));
  let date=today, hours=beachDay(w, m, today, hr);
  if (hours.length < 2){ date=addDays(today,1); hours=beachDay(w, m, date, 9); }
  if (hours.length < 2) return '';
  let best=0;
  for (let k=0; k<hours.length-1; k++) if (hours[k].s+hours[k+1].s > hours[best].s+hours[best+1].s) best=k;
  const a=hours[best], b=hours[best+1], sc=Math.round((a.s+b.s)/2);
  const cls = sc>=70 ? 'ok' : sc>=45 ? 'warn' : 'bad';
  const tit = sc>=70 ? 'Buen momento' : sc>=45 ? 'Momento aceptable' : 'Mal día de playa';
  const col = x => x>=70 ? '#22c55e' : x>=45 ? '#f59e0b' : '#ef4444';
  const bars = hours.map((x,k)=>`<div class="bb ${k===best||k===best+1?'best':''}" title="${pad(x.h)}:00 · ${x.s}/100">
      <div class="bf" style="height:${Math.max(8,x.s)}%;background:${col(x.s)}"></div><span>${x.h}</span></div>`).join('');
  return `<section class="card"><h2>Mejor hora para bajar a la playa · ${date===today?'hoy':'mañana'}</h2>
    <div class="sea ${cls}"><div class="bigh">${pad(a.h)}:00<small>a ${pad(b.h+1)}:00</small></div>
      <div><div class="big">${tit}</div><p>Olas ${((a.wave+b.wave)/2).toFixed(1)} m · ${Math.round((a.feel+b.feel)/2)}° · viento ${Math.round((a.wind+b.wind)/2)} km/h${Math.max(a.uv,b.uv)>=6?' · UV alto, crema':''}</p></div></div>
    <div class="bbars" aria-label="Puntuación por horas">${bars}</div>
    <p class="ms" style="margin-top:6px">Barras: verde = buena hora (pocas olas, temperatura agradable, poco viento).</p></section>`;
}

// ===== Recreo, tender ropa, lavar coche =====
function hourIdx(w, date, h){ return w.hourly.time.indexOf(`${date}T${pad(h)}:00`); }
function uvInfo(u){ return u>=8?['Muy alto','#fee2e2','#b91c1c']:u>=6?['Alto','#ffedd5','#c2410c']:u>=3?['Moderado','#fef3c7','#a16207']:['Bajo','#dcfce7','#15803d']; }

function recreo(sf, date, rH=12){
  const d = new Date(date+'T12:00').getDay(); if (d===0||d===6) return null;
  const i = hourIdx(sf, date, rH); if (i<0) return null;
  const H=sf.hourly, prob=H.precipitation_probability[i]??0, rain=(H.precipitation[i]??0), feel=H.apparent_temperature[i], uv=H.uv_index[i]??0, wind=H.wind_speed_10m[i]??0;
  let r;
  if (prob>=50 || rain>=0.3) r={c:'bad', v:'☔ Recreo dentro', s:`Lluvia probable (${prob}%)`};
  else if (feel>=32) r={c:'bad', v:'🥵 Mucho calor', s:`${Math.round(feel)}° · sombra y agua`};
  else if (feel<6) r={c:'warn', v:'🥶 Frío', s:`${Math.round(feel)}° · salir abrigados`};
  else if (prob>=30) r={c:'warn', v:'🌦️ Patio, con ojo', s:`Puede chispear (${prob}%)`};
  else if (wind>=35) r={c:'warn', v:'💨 Mucho viento', s:`${Math.round(wind)} km/h`};
  else r={c:'ok', v:'✅ Al patio', s:`${Math.round(feel)}° · sin lluvia`};
  const [ut,ub,uc]=uvInfo(uv);
  r.uv=`<span class="uv" style="background:${ub};color:${uc}">UV ${Math.round(uv)} · ${ut}${uv>=6?' · gorra':''}</span>`;
  return r;
}

function tender(mar, date){
  const rows=[]; for(let h=10;h<=19;h++){const i=hourIdx(mar,date,h); if(i>=0) rows.push(i);}
  if(!rows.length) return null;
  const H=mar.hourly, prob=Math.max(...rows.map(i=>H.precipitation_probability[i]??0)),
    rain=rows.reduce((a,i)=>a+(H.precipitation[i]??0),0),
    hum=rows.reduce((a,i)=>a+H.relative_humidity_2m[i],0)/rows.length,
    temp=Math.max(...rows.map(i=>H.temperature_2m[i])), wind=rows.reduce((a,i)=>a+H.wind_speed_10m[i],0)/rows.length;
  if (prob>=40 || rain>=0.2) return {c:'bad', v:'🚫 No tiendas', s:`Lluvia probable (${prob}%)`};
  if (wind>=35) return {c:'warn', v:'💨 Con pinzas', s:'Mucho viento'};
  if (hum<60 && (temp>=16 || wind>=10)) return {c:'ok', v:'👕 Ideal', s:'Se seca rápido'};
  if (hum<75) return {c:'ok', v:'👕 Bien', s:'Tardará algo más'};
  return {c:'warn', v:'🐌 Seca lento', s:`Humedad alta (${Math.round(hum)}%)`};
}

function coche(mar, today){
  const d=mar.daily, i0=d.time.indexOf(today); if(i0<0) return null;
  const names=['hoy','mañana','pasado mañana'];
  for(let k=0;k<3 && i0+k<d.time.length;k++){
    if((d.precipitation_probability_max[i0+k]??0)>=40 || (d.precipitation_sum[i0+k]??0)>=0.5)
      return k===0 ? {c:'bad', v:'🚫 No lo laves', s:'Lloverá hoy'} : {c:'warn', v:'⏳ Espera', s:`Lluvia ${names[k]}`};
  }
  return {c:'ok', v:'🚗 Buen momento', s:'Sin lluvia en 3 días'};
}


// ===== Avisos (calculados por la app con umbrales parecidos a los de AEMET; no oficiales) =====
const AV = {
  calor:  {e:'🌡️', n:'calor',  u:[38,41,44]},   // máxima °C
  frio:   {e:'🥶', n:'frío',   u:[-4,-8,-12]},  // mínima °C (menor o igual)
  lluvia: {e:'🌧️', n:'lluvia', u:[15,30,60]},   // mm en 1 hora
  lluvia12:{e:'🌧️', n:'lluvia', u:[40,80,120]}, // mm en 12 horas
  viento: {e:'💨', n:'viento', u:[70,90,120]},  // rachas km/h
  nieve:  {e:'❄️', n:'nieve',  u:[2,5,20]}      // cm en el día
};
const NIV = ['','Amarillo','Naranja','Rojo'];
function lvlUp(v,u){ return v>=u[2]?3:v>=u[1]?2:v>=u[0]?1:0; }
function lvlDown(v,u){ return v<=u[2]?3:v<=u[1]?2:v<=u[0]?1:0; }
function placeAlerts(p, w){
  const out=[], today=w.current.time.slice(0,10), d=w.daily, H=w.hourly;
  for (let k=0;k<3;k++){
    const date=addDays(today,k), di=d.time.indexOf(date); if(di<0) continue;
    const dn = k===0?'Hoy':k===1?'Mañana':DAYS[new Date(date+'T12:00').getDay()];
    const hs=H.time.map((t,i)=>t.startsWith(date)?i:-1).filter(i=>i>=0);
    const push=(key,lvl,txt)=>{ if(lvl) out.push({lvl,key,day:k,dn,place:p.name,txt}); };
    const tmax=d.temperature_2m_max[di], tmin=d.temperature_2m_min[di];
    push('calor', lvlUp(tmax,AV.calor.u), `hasta ${Math.round(tmax)}°`);
    push('frio', lvlDown(tmin,AV.frio.u), `mínima de ${Math.round(tmin)}°`);
    const r1=Math.max(0,...hs.map(i=>H.precipitation[i]??0));
    let r12=0; hs.forEach((i,j)=>{ let sum=0; for(let q=i;q<i+12&&q<H.time.length;q++) sum+=H.precipitation[q]??0; r12=Math.max(r12,sum); });
    const l1=lvlUp(r1,AV.lluvia.u), l12=lvlUp(r12,AV.lluvia12.u);
    if (l1||l12) push('lluvia', Math.max(l1,l12), l1>=l12 ? `${Math.round(r1)} mm en una hora` : `${Math.round(r12)} mm en 12 horas`);
    const g=Math.max(0,...hs.map(i=>H.wind_gusts_10m?.[i]??0));
    push('viento', lvlUp(g,AV.viento.u), `rachas de ${Math.round(g)} km/h`);
    const sn=hs.reduce((a,i)=>a+(H.snowfall?.[i]??0),0);
    push('nieve', lvlUp(sn,AV.nieve.u), `${Math.round(sn)} cm`);
  }
  return out;
}

// ===== Avisos oficiales de AEMET (avisos.json generado por GitHub Actions) =====
function inPoly(lat, lon, poly){ let ins=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [yi,xi]=poly[i],[yj,xj]=poly[j];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function fenIcon(f){ f=f.toLowerCase();
  return f.includes('máx')||f.includes('max')?'🌡️':f.includes('mín')||f.includes('min')?'🥶':f.includes('torment')?'⛈️':
    f.includes('lluv')||f.includes('precip')?'🌧️':f.includes('nieve')||f.includes('nev')?'❄️':f.includes('vient')?'💨':
    f.includes('coster')?'🌊':f.includes('niebla')?'🌫️':f.includes('polvo')?'🟤':'⚠️'; }
function dayLabel(iso){ if(!iso) return ''; const d=new Date(iso), t=new Date(); t.setHours(0,0,0,0);
  const k=Math.round((new Date(d).setHours(0,0,0,0)-t)/86400000);
  const hh=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  return (k<=0?'Hoy':k===1?'Mañana':DAYS[d.getDay()])+' desde las '+hh; }
async function officialAlerts(){
  try{
    const j=await fetch('avisos.json?_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
    const now=Date.now(), out=[];
    (j.avisos||[]).forEach(a=>{
      if(a.fin && new Date(a.fin).getTime()<now) return;
      const hit=PLACES.filter(p=>a.poligonos.some(pg=>inPoly(p.lat,p.lon,pg)));
      if(hit.length) out.push({...a, places:hit.map(p=>p.name)});
    });
    return out;
  }catch(e){ return null; }
}

async function alertsTile(force){
  const off = await officialAlerts();
  if (off && off.length){
    const top=Math.max(...off.map(a=>a.nivel));
    const rows=off.sort((a,b)=>b.nivel-a.nivel||String(a.inicio).localeCompare(String(b.inicio))).slice(0,6).map(a=>
      `<li><span class="lvdot l${a.nivel}"></span><b>${fenIcon(a.fenomeno)} ${NIV[a.nivel]} por ${esc(a.fenomeno.toLowerCase())}</b> · ${dayLabel(a.inicio)} · ${esc(a.places.join(', '))}
       <details><summary>${esc(a.zona)}</summary>${esc(a.texto||a.titulo)}</details></li>`).join('');
    return `<div class="avi l${top}" role="alert">
      <div class="avi-h"><span class="avi-i" aria-hidden="true">⚠️</span><div><div class="avi-t">Aviso ${NIV[top].toLowerCase()}</div>
      <div class="avi-s"><span class="ofi">AEMET · oficial</span> ${off.length===1?'1 aviso activo':off.length+' avisos activos'}</div></div></div>
      <ul>${rows}</ul><div class="avi-n">Fuente: AEMET. Toca la zona para ver el detalle.</div></div>`;
  }
  const res = await Promise.allSettled(PLACES.map(p=>load(p, force).then(x=>placeAlerts(p, x.w))));
  const all = res.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)
    .sort((a,b)=>b.lvl-a.lvl || a.day-b.day);
  if (!all.length) return `<div class="mini ok"><div class="mt">Avisos · 3 días</div><div class="mv">✅ Sin avisos</div><div class="ms">${off ? 'Sin avisos oficiales de AEMET ni previstos.' : 'Ni lluvia fuerte, ni viento, ni calor o frío extremos.'}</div></div>`;
  const top = all[0].lvl;
  const rows = all.slice(0,6).map(a=>`<li><span class="lvdot l${a.lvl}"></span><b>${AV[a.key].e} ${NIV[a.lvl]} por ${AV[a.key].n}</b> · ${a.dn} · ${esc(a.place)}: ${a.txt}</li>`).join('');
  return `<div class="avi l${top}" role="alert">
    <div class="avi-h"><span class="avi-i" aria-hidden="true">⚠️</span><div><div class="avi-t">Aviso ${NIV[top].toLowerCase()}</div>
    <div class="avi-s">${all.length===1?'1 aviso':all.length+' avisos'} en los próximos 3 días</div></div></div>
    <ul>${rows}</ul><div class="avi-n">${off ? 'AEMET no tiene avisos oficiales para tus localidades. Estos los calcula la app como previsión.' : 'Calculado por la app con umbrales parecidos a los de AEMET.'}</div></div>`;
}

// ===== Cancelas del cole (entrada y salida con lluvia) =====
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+(m||0); };
const fmt = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function gateSvg(open, dir){
  const bars = open
    ? `<path d="M12 18 L22 22 L22 50 L12 52 Z" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M15 20 V51 M18 21 V51" stroke="#475569" stroke-width="2"/>
       <path d="M52 18 L42 22 L42 50 L52 52 Z" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M49 20 V51 M46 21 V51" stroke="#475569" stroke-width="2"/>
       <g fill="#38bdf8"><path d="M30 6 q-2 4 0 5 q2-1 0-5Z"/><path d="M38 10 q-2 4 0 5 q2-1 0-5Z"/><path d="M26 13 q-2 4 0 5 q2-1 0-5Z"/></g>`
    : `<rect x="12" y="18" width="40" height="34" fill="none" stroke="#475569" stroke-width="2.5"/>
       <path d="M18 18 V52 M24 18 V52 M30 18 V52 M34 18 V52 M40 18 V52 M46 18 V52" stroke="#475569" stroke-width="2"/>
       <path d="M12 26 H52 M12 44 H52" stroke="#475569" stroke-width="2"/><circle cx="32" cy="35" r="2.5" fill="#f59e0b"/>`;
  const arrow = dir==='in'
    ? `<circle cx="52" cy="54" r="9" fill="#22c55e"/><path d="M47 54 H57 M53 50 L57 54 L53 58" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : `<circle cx="52" cy="54" r="9" fill="#f97316"/><path d="M57 54 H47 M51 50 L47 54 L51 58" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect x="5" y="12" width="7" height="46" rx="2" fill="#94a3b8"/><rect x="52" y="12" width="7" height="46" rx="2" fill="#94a3b8"/><path d="M4 12 h9 l-4.5 -5Z M51 12 h9 l-4.5 -5Z" fill="#64748b"/>${bars}${arrow}</svg>`;
}
function wetAround(w, date, min){
  let pr=0, mm=0;
  [min-15, min+15].forEach(m=>{ const i=w.hourly.time.indexOf(`${date}T${pad(Math.floor(m/60))}:00`);
    if(i>=0){ pr=Math.max(pr, w.hourly.precipitation_probability[i]??0); mm=Math.max(mm, w.hourly.precipitation[i]??0); } });
  return {wet: pr>=40 || mm>=0.2, pr};
}
function cancelasDay(w, cfg){
  const now=w.current.time, today=now.slice(0,10), nowMin=toMin(now.slice(11,16));
  let date=today; if (nowMin > toMin(cfg.salCole)+10) date=addDays(today,1);
  for (let k=0;k<4;k++){ const d=new Date(date+'T12:00').getDay(); if(d!==0&&d!==6) break; date=addDays(date,1); }
  return date;
}
function cancelas(w, date, cfg){
  if (w.hourly.time.indexOf(`${date}T12:00`)<0) return null;
  const e=toMin(cfg.entrada), s=toMin(cfg.salCole);
  const we=wetAround(w,date,e), ws=wetAround(w,date,s);
  return {date, ent:{...we, t:fmt(we.wet?e-5:e)}, sal:{...ws, t:fmt(s)}};
}
function cancelasHtml(c, today){
  const dn = c.date===today?'hoy':c.date===addDays(today,1)?'mañana':DAYS[new Date(c.date+'T12:00').getDay()].toLowerCase();
  const side=(lbl,x,dir)=>`<div class="cg ${x.wet?'wet':''}">${gateSvg(x.wet,dir)}<div><div class="cgl">${lbl}</div><div class="cgt">${x.t}</div>
    <div class="cgs">${x.wet?`🌧️ Abre las cancelas (${x.pr}%)`:'Sin lluvia · normal'}</div></div></div>`;
  const any=c.ent.wet||c.sal.wet;
  return `<div class="mini cancel ${any?'rainy':'ok'}" ${any?'role="alert"':''}><div class="mt">Cancelas del cole · ${dn}</div>
    <div class="cgrid">${side('Entrada',c.ent,'in')}${side('Salida',c.sal,'out')}</div></div>`;
}

async function showMinis(force){
  const box=document.getElementById('minis');
  try{
    const cfg0=getCfg();
    const [mar, sf] = await Promise.all([load(byId(cfg0.casa), force), load(byId(cfg0.trabajo), force)]);
    const cfg=cfg0, nowS=sf.w.current.time, today=nowS.slice(0,10), hr=parseInt(nowS.slice(11,13));
    const rH=parseInt(cfg.recreo), dRec = hr>=rH+1 ? addDays(today,1) : today, dTen = hr>=19 ? addDays(today,1) : today;
    const tiles=[];
    const r=recreo(sf.w, dRec, rH); if(r) tiles.push(['Recreo '+(dRec===today?'hoy':'mañana')+' · '+cfg.recreo, r]);
    const t=tender(mar.w, dTen); if(t) tiles.push(['Tender '+(dTen===today?'hoy':'mañana'), t]);
    const c=coche(mar.w, today); if(c) tiles.push(['Lavar el coche', c]);
    const av = await alertsTile(force);
    const cn = cancelas(sf.w, cancelasDay(sf.w, cfg), cfg);
    box.innerHTML = av + (cn ? cancelasHtml(cn, today) : '') + tiles.map(([title,x])=>`<div class="mini ${x.c}"><div class="mt">${title}</div><div class="mv">${x.v}</div><div class="ms">${x.s}</div>${x.uv||''}</div>`).join('');
  }catch(e){ box.innerHTML=''; }
}

// ===== Radar de lluvia (RainViewer) =====
let rMap=null, rTimer=null;
function loadLeaflet(){
  if (window.L) return Promise.resolve();
  return new Promise((ok,ko)=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; sc.onload=ok; sc.onerror=ko; document.head.appendChild(sc);});
}
function stopRadar(){ if(rTimer){clearInterval(rTimer); rTimer=null;} if(rMap){rMap.remove(); rMap=null;} }
async function showRadar(){
  const main=document.getElementById('main');
  main.innerHTML=`<section class="card"><h2>Radar de lluvia · últimas 2 horas</h2><div id="map"></div>
    <div class="rbar"><button class="btn" id="play" aria-label="Pausar o reproducir">⏸</button>
    <input type="range" id="rslider" min="0" max="0" value="0" aria-label="Momento del radar"><span id="rtime">—</span></div></section>`;
  try{
    await loadLeaflet();
    const data = await fetch('https://api.rainviewer.com/public/weather-maps.json').then(r=>r.json());
    if (current!=='radar') return;
    rMap = L.map('map',{attributionControl:true}).setView([37.0,-3.55],8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {subdomains:'abcd',maxZoom:11,attribution:'© OpenStreetMap · © CARTO · Radar © RainViewer'}).addTo(rMap);
    PLACES.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:6,color:'#0369a1',fillColor:'#38bdf8',fillOpacity:1,weight:2}).addTo(rMap).bindTooltip(p.name,{permanent:true,direction:'right'}));
    const frames=[...(data.radar.past||[]), ...(data.radar.nowcast||[])];
    const layers=frames.map(f=>L.tileLayer(`${data.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:11,zIndex:5}).addTo(rMap));
    const sl=document.getElementById('rslider'), tl=document.getElementById('rtime'), pl=document.getElementById('play');
    sl.max=frames.length-1; let pos=frames.length-1;
    const draw=i=>{layers.forEach((l,k)=>l.setOpacity(k===i?.75:0)); sl.value=i;
      tl.textContent=new Date(frames[i].time*1000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});};
    const play=()=>{rTimer=setInterval(()=>{pos=(pos+1)%frames.length;draw(pos);},700); pl.textContent='⏸';};
    const pause=()=>{clearInterval(rTimer);rTimer=null;pl.textContent='▶';};
    pl.onclick=()=>rTimer?pause():play();
    sl.oninput=()=>{pause();pos=+sl.value;draw(pos);};
    draw(pos); play();
  }catch(e){
    main.innerHTML='<div class="err">⚠️ No se ha podido cargar el radar. Comprueba la conexión y pulsa «Actualizar».</div>';
  }
}


// ===== Ajustes: localidades y horario =====
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function findSea(lat, lon){
  const off=[[0,0],[-0.03,0],[-0.06,0],[0,0.05],[0,-0.05],[0.03,0],[-0.1,0],[0,0.1],[0,-0.1]];
  const la=off.map(o=>(lat+o[0]).toFixed(3)).join(','), lo=off.map(o=>(lon+o[1]).toFixed(3)).join(',');
  try{
    let r = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${la}&longitude=${lo}&current=wave_height`).then(r=>r.json());
    if (!Array.isArray(r)) r=[r];
    for (let k=0;k<r.length;k++){ const v=r[k]?.current?.wave_height; if (v!=null) return {lat:+(lat+off[k][0]).toFixed(3), lon:+(lon+off[k][1]).toFixed(3)}; }
  }catch(e){}
  return null;
}
function openSettings(){
  let dlg=document.getElementById('dlg');
  if(!dlg){ dlg=document.createElement('div'); dlg.id='dlg'; dlg.className='dlg'; document.body.appendChild(dlg);
    dlg.addEventListener('click',e=>{ if(e.target===dlg) closeSettings(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSettings(); }); }
  const cfg=getCfg();
  const opts=sel=>PLACES.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
  dlg.innerHTML=`<div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <div class="top"><h2 id="dlgT">Ajustes</h2><button class="gear" id="dlgX" aria-label="Cerrar">✕</button></div>
    <h3>Mis localidades</h3>
    <div class="plist">${PLACES.map((p,k)=>`<div class="prow"><span>${p.sea?'🌊 ':''}<b>${esc(p.name)}</b> <small>${esc(p.sub||'')}</small></span>
      <span><button class="mini-b" data-up="${k}" aria-label="Subir" ${k===0?'disabled':''}>▲</button><button class="mini-b" data-down="${k}" aria-label="Bajar" ${k===PLACES.length-1?'disabled':''}>▼</button><button class="mini-b del" data-del="${k}" aria-label="Quitar ${esc(p.name)}" ${PLACES.length<2?'disabled':''}>✕</button></span></div>`).join('')}</div>
    <label for="q" class="lab">Añadir localidad</label>
    <div class="srch"><input id="q" type="search" placeholder="Ej.: Atarfe, Almuñécar…" autocomplete="off"><button class="btn" id="qb">Buscar</button></div>
    <div id="qr" class="qr" aria-live="polite"></div>
    <h3>Mi día</h3>
    <div class="grid2">
      <label class="lab" for="sCasa">Salgo de<select id="sCasa">${opts(cfg.casa)}</select></label>
      <label class="lab" for="sTrab">Trabajo en<select id="sTrab">${opts(cfg.trabajo)}</select></label>
      <label class="lab" for="sal">Hora de salida<input type="time" id="sal" step="3600" value="${cfg.salida}"></label>
      <label class="lab" for="vue">Hora de vuelta<input type="time" id="vue" step="3600" value="${cfg.vuelta}"></label>
      <label class="lab" for="rec">Recreo<input type="time" id="rec" step="1800" value="${cfg.recreo}"></label>
      <label class="lab" for="ent">Abro cancelas (entrada)<input type="time" id="ent" step="300" value="${cfg.entrada}"></label>
      <label class="lab" for="scl">Abro cancelas (salida)<input type="time" id="scl" step="300" value="${cfg.salCole}"></label>
    </div>
    <button class="btn ok-b" id="dlgOk">Guardar</button></div>`;
  dlg.classList.add('open');
  const redraw=()=>{ savePlaces(); renderTabs(); openSettings(); };
  dlg.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const k=+b.dataset.up;[PLACES[k-1],PLACES[k]]=[PLACES[k],PLACES[k-1]];redraw();});
  dlg.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const k=+b.dataset.down;[PLACES[k+1],PLACES[k]]=[PLACES[k],PLACES[k+1]];redraw();});
  dlg.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=+b.dataset.del;const id=PLACES[k].id;PLACES.splice(k,1);
    if(current===id) current=PLACES[0].id; redraw();});
  const search=async()=>{
    const q=document.getElementById('q').value.trim(), out=document.getElementById('qr'), qb=document.getElementById('qb');
    if(q.length<2){ out.innerHTML='<p class="ms">Escribe al menos 2 letras.</p>'; return; }
    qb.disabled=true; out.innerHTML='<p class="ms">Buscando…</p>';
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=es&format=json`).then(r=>r.json());
      const res=r.results||[];
      out.innerHTML = res.length ? res.map((x,k)=>`<button class="qrow" data-k="${k}"><b>${esc(x.name)}</b> <small>${esc([x.admin2,x.admin1,x.country].filter(Boolean).join(' · '))}</small></button>`).join('') : '<p class="ms">No se ha encontrado ninguna localidad.</p>';
      out.querySelectorAll('.qrow').forEach(b=>b.onclick=async()=>{
        const x=res[+b.dataset.k]; b.disabled=true; b.innerHTML+=' <small>· añadiendo…</small>';
        const sea=await findSea(x.latitude, x.longitude);
        const np={id:'p'+Date.now(), name:x.name, sub:x.admin2||x.admin1||x.country||'', lat:+x.latitude.toFixed(4), lon:+x.longitude.toFixed(4)};
        if(sea) np.sea=sea;
        PLACES.push(np); redraw();
      });
    }catch(e){ out.innerHTML='<p class="ms">⚠️ No se ha podido buscar. Comprueba la conexión.</p>'; }
    finally{ qb.disabled=false; }
  };
  document.getElementById('qb').onclick=search;
  document.getElementById('q').onkeydown=e=>{ if(e.key==='Enter') search(); };
  document.getElementById('dlgX').onclick=closeSettings;
  document.getElementById('dlgOk').onclick=()=>{
    setCfg({salida:document.getElementById('sal').value||'08:00', vuelta:document.getElementById('vue').value||'15:00',
      recreo:document.getElementById('rec').value||'12:00', entrada:document.getElementById('ent').value||'09:00', salCole:document.getElementById('scl').value||'13:50', casa:document.getElementById('sCasa').value, trabajo:document.getElementById('sTrab').value});
    closeSettings();
  };
}
function closeSettings(){
  const dlg=document.getElementById('dlg'); if(!dlg||!dlg.classList.contains('open')) return;
  dlg.classList.remove('open'); try{localStorage.setItem('mt-place',current)}catch(e){}
  renderTabs(); show(); showAdvice(); showMinis();
}

document.getElementById('refresh').onclick = async () => {
  const b = document.getElementById('refresh'); b.textContent = '↻ Actualizando…';
  Object.keys(cache).forEach(k => delete cache[k]);
  await Promise.all([show(true), showAdvice(true), showMinis(true)]);
  b.textContent = '✓ Actualizado'; setTimeout(()=>{ b.textContent = '↻ Actualizar'; }, 2000);
};
showMinis();
showAdvice();
renderTabs(); show();
setInterval(()=>{ if(current!=='radar') show(true); showAdvice(); showMinis(); }, 15*60*1000);
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloaded){reloaded=true; location.reload();} });
}
</script>
